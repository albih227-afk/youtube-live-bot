name: YouTube Live Stream

on:
  workflow_dispatch: # ম্যানুয়ালি লাইভ শুরু করার জন্য

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Live Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # ভিডিওটি অনলাইন থেকে ডাউনলোড করে সরাসরি লাইভ করা অথবা লোকাল ফাইল ব্যবহার
          # এখানে উদাহরণস্বরূপ 'video.mp4' ফাইল লুপ করে চালানো হচ্ছে:
          ffmpeg -re -stream_loop -1 -i "video.mp4" -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
